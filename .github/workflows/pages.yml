name: HIGHFLY · SKILL LAB L27 — HUD EDITABLE + 15 VFX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: independent-highfly-fury-skill-lab-pages
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout ONLY the CI-validated L27 unified combat island
        uses: actions/checkout@v4
        with:
          repository: drakenhok-star/HIGHFLY-ORIGIN-DEMO
          ref: 5ef91c3acb5c323f33d70f4103349d1581a1d87b
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate L27 HUD ENFOCAR, 15 legal VFX, aerial rupture, one island and FURY
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C game rev-parse HEAD)" = "5ef91c3acb5c323f33d70f4103349d1581a1d87b"
          cd game
          test -s LICENSE && test -s PROVENANCE.md
          test -s lab.html && test -s styles.css
          test -s assets/models/dragon_evolved_quaternius.glb
          test -s assets/models/draugr_skeleton_warrior.glb
          test -s src/skillslab/training-layout-l24.js
          test -s src/skillslab/monster-focus-l23.js
          test -s src/skillslab/signature-vfx-l22.js
          test -s src/skillslab/fireball-vfx-l22.js
          test -s src/skillslab/premium-vfx-l25.js
          test -s src/skillslab/aerial-rupture-l25.js
          test -s src/skillslab/rupture-state-l25.js
          test -s src/skillslab/claudecraft-vfx-l26.js
          test -s src/skillslab/skill-catalog-export-l26.js
          test -s tests/l27-dotless-profile-export.test.mjs
          test -s docs/L27_VFX_RESTORATION_HUD_AND_EXPORT.md
          test -s docs/L25_VFX_DEPENDENCY_AUDIT_AND_AERIAL_RUPTURE.md
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
          node tests/p15-finisher.test.mjs
          node tests/p15-interruption.test.mjs
          node tests/p16-hit-confirm.test.mjs
          node tests/p19-fury-skills.test.mjs
          node tests/l23-monster-focus.test.mjs
          node tests/l24-unified-island.test.mjs
          node tests/l25-vfx-air-rupture.test.mjs
          node tests/l26-vfx-hud-export.test.mjs
          node tests/l27-dotless-profile-export.test.mjs
          node scripts/audit_animation_p6.mjs
          ! find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
      - name: Make ONE static Pages tree (no /l21 /l22 /l23 duplicates)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p site
          cp -a game/lab.html game/styles.css game/src game/lib game/assets game/LICENSE game/PROVENANCE.md site/
          cp game/lab.html site/index.html
          touch site/.nojekyll
          test -s site/index.html
          test -s site/src/skillslab/boot.js
          test -s site/src/skillslab/training-layout-l24.js
          test -s site/src/skillslab/aerial-rupture-l25.js
          test -s site/src/skillslab/premium-vfx-l25.js
          test -s site/src/skillslab/rupture-state-l25.js
          test -s site/src/skillslab/claudecraft-vfx-l26.js
          test -s site/src/skillslab/skill-catalog-export-l26.js
          test -s site/src/skillslab/skills-web.js
          test -s site/assets/models/dragon_evolved_quaternius.glb
          test -s site/assets/models/draugr_skeleton_warrior.glb
          ! test -e site/l22
          ! test -e site/l23
          du -sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish ONE L27 Pages, principal HIGHFLY remains untouched
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
