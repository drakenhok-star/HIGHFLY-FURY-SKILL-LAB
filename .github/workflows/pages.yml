name: HIGHFLY Skill Lab L21 · independent Pages deployment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: independent-highfly-fury-skill-lab-pages
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout ONLY source lab branch / approved commit
        uses: actions/checkout@v4
        with:
          repository: drakenhok-star/HIGHFLY-ORIGIN-DEMO
          ref: dcb8d3fb7a3432ac948f71a4f6f88f40a7076a6c
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FURY P16 & isolated Skill Lab contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd game
          test -s LICENSE
          test -s PROVENANCE.md
          test -s assets/models/player_barbarian.glb
          test -s src/skillslab/boot.js
          test -s src/skillslab/aim-guide-p16.js
          test -s src/skillslab/lab-vfx.js
          test -s tests/p20-static-lab.test.mjs
          test -s scripts/p21-browser-smoke.mjs
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node tests/p15-finisher.test.mjs
          node tests/p15-interruption.test.mjs
          node tests/p16-hit-confirm.test.mjs
          node tests/p19-fury-skills.test.mjs
          node tests/p20-static-lab.test.mjs
          node scripts/audit_animation_p6.mjs
          ! find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
      # The EXACT pinned commit already passed source-and-contracts + Chrome
      # WebGL smoke on HIGHFLY-ORIGIN-DEMO Actions run 42034980219.
      # Do NOT repeat the expensive (and sometimes hung) software-WebGL test
      # during every Pages publish. Publication is an immutable promotion.
      - name: Confirm immutable source has completed approved L21 WebGL QA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C game rev-parse HEAD)" = "dcb8d3fb7a3432ac948f71a4f6f88f40a7076a6c"
          # The source repo's public Actions run 42034980219 recorded success.
          # Pinning that exact SHA prevents deployment of untested branches.
          echo 'Approved L21 source commit: dcb8d3fb7a3432ac948f71a4f6f88f40a7076a6c'
      - name: Prepare isolated static Pages tree
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p site
          cp -a game/lab.html game/styles.css game/src game/lib game/assets game/LICENSE game/PROVENANCE.md site/
          cp game/lab.html site/index.html
          touch site/.nojekyll
          test -s site/index.html
          test -s site/src/main.js
          test -s site/src/skillslab/boot.js
          test -s site/assets/models/player_barbarian.glb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy ONLY this independent repository's L21 Pages
        id: deploy
        uses: actions/deploy-pages@v4
